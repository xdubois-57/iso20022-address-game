sonar.projectKey=xdubois-57_iso20022-address-game
sonar.organization=xdubois-57

sonar.projectName=ISO 20022 Address Structuring Game
sonar.sourceEncoding=UTF-8

# First-party code only. public/ carries both the front controller and the
# browser JavaScript, so it is a source root; tests are declared separately
# below so Sonar judges them by test rules rather than production ones.
sonar.sources=app,public,scripts
sonar.tests=tests

sonar.exclusions=\
    vendor/**,\
    node_modules/**,\
    coverage/**,\
    test-results/**,\
    playwright-report/**,\
    public/assets/js/vendor/**,\
    public/assets/Scenarios.xlsx,\
    public/assets/fonts/**,\
    public/assets/images/**

# Third-party, and minified: analysing it would bury real findings under
# thousands of issues in code this project does not own. See
# public/assets/js/vendor/README.md.
sonar.coverage.exclusions=\
    scripts/**,\
    public/index.php,\
    app/Views/**

# Test code is not measured for duplication - fixtures and arrange blocks
# repeat by nature, and flagging that pushes toward less readable tests.
sonar.cpd.exclusions=tests/**

sonar.php.coverage.reportPaths=coverage/php/clover.xml
sonar.javascript.lcov.reportPaths=coverage/js/lcov.info
