# CodeQL — security analysis of the JavaScript, AND ONLY OF THE JAVASCRIPT.
#
# ---------------------------------------------------------------------------
# WHAT THIS WORKFLOW DOES NOT COVER
# ---------------------------------------------------------------------------
# CodeQL does not support PHP. It never has, and there is no language value
# that would make it. So everything under app/ — the controllers, the models,
# the routing in public/index.php, which between them are the majority of this
# application's logic and all of its database access, encryption, session
# handling and input validation — IS NOT ANALYSED HERE AT ALL.
#
# This is written down because a green badge is a claim, and somebody will
# eventually read this one as "the code is scanned". What is scanned is
# public/assets/js/: the SPA and its lib/ modules.
#
# The PHP is covered by other things, and they are where to look:
#   - PHPStan level 6 (phpstan.neon, the `static-analysis` job in ci.yml)
#   - SonarCloud (sonar-project.properties, the `sonarcloud` job in ci.yml)
#   - the passive DAST scan, which exercises the running application through
#     the browser suite (scripts/dast.sh, the `dast` job in ci.yml)
#
# Do not add `php` to the languages below expecting it to work, and do not
# describe this workflow as covering the application.
# ---------------------------------------------------------------------------

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query finds this code without waiting for
    # somebody to push. Monday morning, off the hour: GitHub drops scheduled
    # runs that all land on the same minute across every repository.
    - cron: '23 6 * * 1'

# A second push to the same branch makes the first run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      # Publishing to the Security tab is the whole point of the workflow.
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript, and nothing else. See the header: there is no
        # PHP analysis to add here, and adding a language that does not exist
        # would fail the workflow rather than widen it.
        language: ['javascript-typescript']

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-and-quality over the default security-extended: this is a
          # small first-party JavaScript surface, and the quality queries cost
          # little on it.
          queries: security-and-quality

      # No build step, deliberately and by design: the SPA is plain unbundled
      # JavaScript that ships exactly as written (README, Static analysis).
      # There is nothing to compile, so the extractor reads the sources
      # directly.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
