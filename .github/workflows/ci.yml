name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The floor the project actually claims to support (composer.json / README),
  # not just the version that happens to be installed on a developer machine.
  # This exists because a dependency upgrade once silently raised the real
  # minimum to 8.2 while both still advertised 8.1.
  php-tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, zip, pdo_sqlite, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run tests
        run: composer test

  # Defects the three test suites cannot see, because they are in code that
  # never runs under them: unresolved identifiers, wrong argument counts,
  # properties that do not exist on the thing being touched.
  #
  # Both halves are BASELINED (phpstan-baseline.neon, js-typecheck-baseline.json).
  # Green means "no NEW finding", never "no findings" — see README.md
  # § Static analysis, and read the header of either baseline before
  # regenerating one.
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, zip, pdo_sqlite, mbstring
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: npm ci

      - name: PHPStan
        run: composer run analyse

      - name: TypeScript (checker only, nothing is emitted)
        run: npm run typecheck

  js-tests:
    name: JavaScript unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: End-to-end (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, zip, pdo_sqlite, mbstring
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # A passive scan of the running application, on every push.
  #
  # The Playwright suite is the attack surface, not a crawler: it drives the
  # admin screen from behind its PIN pad, both display modes with their token,
  # a whole game and the share flow, none of which a spider reaches. The build
  # fails on any finding at Medium or above (DAST_THRESHOLD).
  dast:
    name: Dynamic scan (passive)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # No security-events: write, deliberately. See "Why the findings are not
      # in the Security tab" below.
    # The bound covers a cold 1.2 GB image pull plus the whole browser suite
    # replayed through a proxy.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # openssl generates the run's certificate and pcntl runs the TLS
          # terminator; without both, scripts/dast.sh refuses to start.
          extensions: gd, zip, pdo_sqlite, mbstring, openssl, pcntl
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Pull the OWASP ZAP image
        # scripts/dast.sh deliberately refuses to download 1.2 GB on a caller's
        # behalf, so the pull is explicit here - the one place where
        # downloading it is the expected thing to happen.
        run: docker pull ghcr.io/zaproxy/zaproxy:stable

      - name: Run the passive scan
        run: npm run dast

      # Why the findings are not in the Security tab
      # ------------------------------------------------------------
      # Code scanning anchors a result to a path inside the checkout, so it can
      # blame a commit and a line for it. A DAST result is an observation about
      # a RUNNING instance: ZAP records the URL it actually requested, and
      # scripts/dast.sh serves that instance on a free port picked at run time,
      # so every location reads https://localhost:<random>/... - an origin that
      # never existed outside this one job and is different on the next.
      # Rewriting those URLs into repository paths would make an upload succeed
      # by inventing a source location for a finding that has none, pinning a
      # header observation onto whichever file was chosen to carry it.
      #
      # The gate is not weakened by that: scripts/dast.sh exits non-zero on any
      # finding at or above Medium, which fails this job on the very push that
      # introduced it - enforcement the Security tab never provided. The HTML
      # report is in this job's log for whoever is debugging a red build, and
      # is deliberately NOT uploaded as an artifact: this repository is public,
      # so its workflow artifacts are too.

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    env:
      # Job level, not step level: a step's own `env:` is not in scope for
      # that step's `if:`, so guarding on it there would always see ''.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar uses git history to attribute issues to authors and to work
          # out what is "new code"; a shallow clone makes both wrong.
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, zip, pdo_sqlite, mbstring
          # pcov is markedly faster than Xdebug and is all that is needed to
          # emit line coverage.
          coverage: pcov

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: npm ci

      # Chromium is needed because the browser suite is part of the coverage
      # picture below, not just its own job.
      - run: npx playwright install --with-deps chromium

      # All three reports must exist in this one workspace before the scan
      # runs, at the paths sonar-project.properties declares.
      #
      # PHP coverage comes from TWO producers and is only complete once
      # merged: PHPUnit writes a .cov, and the browser run writes one .raw per
      # request it makes (E2E_COVERAGE=1). Skipping the merge is not a smaller
      # number, it is NO php clover file at all — which is exactly what
      # happened on the first real scan: Sonar reported 27.4% because it saw
      # the JavaScript lcov and nothing else.
      - name: PHP unit coverage
        run: composer run test:coverage

      - name: PHP coverage from the browser suite
        env:
          E2E_COVERAGE: '1'
        run: npm run e2e

      - name: Merge PHP coverage into one Clover report
        run: composer run coverage:merge

      - name: JavaScript coverage (lcov)
        run: npm run test:coverage

      # Fail loudly rather than let the scan silently upload a partial
      # picture: a missing or tiny report is how coverage quietly reads as
      # near-zero on the dashboard while every job stays green.
      - name: Check both coverage reports exist
        run: |
          test -s coverage/php/clover.xml || { echo "::error::coverage/php/clover.xml missing or empty"; exit 1; }
          test -s coverage/js/lcov.info   || { echo "::error::coverage/js/lcov.info missing or empty"; exit 1; }
          php -r '$x = simplexml_load_file("coverage/php/clover.xml"); $m = $x->project->metrics;
            printf("PHP coverage: %.1f%% (%d/%d statements)\n", 100 * (int)$m["coveredstatements"] / max(1, (int)$m["statements"]),
            (int)$m["coveredstatements"], (int)$m["statements"]);'

      - name: SonarCloud scan
        # Skipped rather than failed when the secret is absent, so pull
        # requests from forks (which cannot read secrets) still run the rest
        # of CI instead of reporting a red build nobody can fix.
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8
