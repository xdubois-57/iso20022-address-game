# The slow, complete pass: every gate, then a DRAFT Release carrying the
# evidence that the gates ran.
#
# NOT MERGED WITH ci.yml, on purpose. That one is the fast feedback loop on
# every push and has to stay fast. This one takes as long as it takes. What
# they share — the gates themselves — lives in checks.yml and is called by
# both, so the two can never disagree about what "green" means.
#
# WHAT IS IN THE PACK
# ---------------------------------------------------------------------------
# Only what the tools emit NATIVELY: PHPUnit's JUnit log for both supported PHP
# versions, Vitest's JUnit report, Playwright's own HTML report with a
# screenshot per test, PHPStan's output, tsc's output, CodeQL's SARIF, and
# SonarCloud's quality gate as their API returns it.
#
# No hand-written summary of any result. A document somebody writes once to
# describe a pipeline is a document nobody updates when the pipeline changes,
# and evidence that has stopped being true is worse than no evidence.
#
# ONE EXCEPTION, IN THE OTHER DIRECTION
# ---------------------------------------------------------------------------
# The DAST evidence is COUNTS BY SEVERITY ONLY. This repository is public, so
# its Release assets are public — and so are its workflow artifacts, which is
# less widely known. A detailed dynamic-scan report published on a public
# repository is a map drawn for whoever wants one. The full report stays in the
# scan job's log.
#
# ORDERING
# ---------------------------------------------------------------------------
# Every gate first. The Release is created ONLY if all of them are green, and
# it is created as a DRAFT so the evidence can be read before it is public. If
# a gate fails, no Release is created at all: the tag exists and points at
# nothing published, which is fixed by deleting the tag and pushing it again.

name: Release

on:
  push:
    tags:
      - 'v*'
  # Counts as much as the tag does. It is how a set of evidence is produced for
  # what is already deployed, or how the whole chain is rehearsed, without
  # cutting a version.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every gate, with each tool's native output collected.
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
    with:
      evidence: true

  # CodeQL's SARIF, captured as a FILE for the evidence pack and deliberately
  # not uploaded.
  #
  # This repository runs CodeQL through GitHub's DEFAULT SETUP, which is what
  # feeds the Security tab and what covers javascript-typescript and actions.
  # An advanced configuration cannot upload alongside it — GitHub rejects the
  # SARIF outright ("CodeQL analyses from advanced configurations cannot be
  # processed when the default setup is enabled") — so `upload: never` below is
  # not a preference, it is the only way this job can coexist with it. The
  # analysis still runs and still produces the SARIF the pack wants.
  #
  # Re-run here rather than reached for across workflows: an artifact from
  # another workflow's run is addressable only by digging through the API for
  # a run id, and the whole point of a release pack is that every piece of it
  # was produced by THIS pass over THIS commit.
  #
  # It analyses javascript-typescript only — CodeQL does not support PHP, so
  # everything under app/ is outside it, here and in the default setup alike.
  codeql-evidence:
    name: CodeQL evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
          output: codeql-sarif
          # See the job comment: the repository's default setup owns the
          # Security tab, and uploading from here is refused by GitHub rather
          # than merely redundant.
          upload: never

      - name: Upload the SARIF as evidence
        uses: actions/upload-artifact@v7
        with:
          name: evidence-codeql
          path: codeql-sarif/
          retention-days: 7

  # SonarCloud's COMPLETE analysis, not just its verdict: the quality gate, every
  # project measure, the same per file, every open issue and every security
  # hotspot, plus a Markdown front page. The gate on its own says pass or fail
  # and nothing about what was found — and a pack whose reader has to log in to
  # SonarCloud to learn that is not evidence.
  sonar-evidence:
    name: SonarCloud evidence
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl
          coverage: none

      # The fetching, the pagination and the report all live in the script, so
      # they can be read and run outside CI. Without the secret it writes an
      # UNAVAILABLE marker and exits 0 rather than arriving one file short: a
      # missing file reads as an oversight, a file saying "not available, and
      # why" reads as a fact, and a pull request from a fork cannot see
      # secrets.
      - name: Fetch the whole SonarCloud analysis
        run: |
          php scripts/sonar-evidence.php evidence
          cat evidence/sonarcloud-report.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the SonarCloud report
        uses: actions/upload-artifact@v7
        with:
          name: evidence-sonarcloud
          path: evidence/
          retention-days: 7

  # Coverage, computed exactly as the SonarCloud job in ci.yml computes it.
  #
  # The whole calculation is repeated rather than a cheaper half of it, and
  # that is the point: PHP coverage has TWO producers, PHPUnit and the browser
  # suite, and is only complete once merged. Attaching the unit half alone
  # would put a number in this pack that disagrees with the number in the
  # SonarCloud report in the same pack, which is worse for a reader than no
  # number at all.
  #
  # It runs beside the other jobs rather than after them, so it costs the
  # release little wall-clock time.
  coverage-evidence:
    name: Coverage evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, zip, pdo_sqlite, mbstring
          coverage: pcov

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: PHP unit coverage
        run: composer run test:coverage

      - name: PHP coverage from the browser suite
        env:
          E2E_COVERAGE: '1'
        run: npm run e2e

      - name: Merge PHP coverage into one Clover report
        run: composer run coverage:merge

      - name: JavaScript coverage (lcov)
        run: npm run test:coverage

      - name: Collect the reports, with the figure they add up to
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp coverage/php/clover.xml evidence/php-clover.xml
          cp coverage/js/lcov.info evidence/js-lcov.info
          php -r '$x = simplexml_load_file("coverage/php/clover.xml");
            $m = $x->project->metrics;
            printf("PHP: %.1f%% (%d of %d statements)\n",
              100 * (int) $m["coveredstatements"] / max(1, (int) $m["statements"]),
              (int) $m["coveredstatements"], (int) $m["statements"]);' \
            > evidence/coverage-summary.txt
          cat evidence/coverage-summary.txt

      - name: Upload the coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: evidence-coverage
          path: evidence/
          retention-days: 7

  # Nothing above this line has published anything. Everything below runs only
  # if every gate went green.
  release:
    name: Draft Release
    runs-on: ubuntu-latest
    needs: [checks, codeql-evidence, sonar-evidence, coverage-evidence]
    permissions:
      contents: write
      # Both are required by actions/attest-build-provenance: id-token to get
      # the OIDC credential Sigstore signs against, attestations to record the
      # result against the repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Collect every piece of evidence
        uses: actions/download-artifact@v8
        with:
          pattern: evidence-*
          path: evidence-raw

      # One archive rather than a dozen loose assets: the pack is read
      # together, and a Release page listing fifteen files is a Release page
      # nobody opens.
      #
      # The guard is not ceremony. If a rename upstream ever makes the download
      # pattern match nothing, an empty zip would be attached to a Release and
      # would look exactly like evidence.
      # WHAT this pack is evidence OF. Without it the archive is a set of
      # reports with nothing tying them to a commit, a repository or a moment
      # — the Release page says all three, but the zip somebody downloads and
      # forwards does not, and that is the copy an auditor ends up holding.
      #
      # Every value comes from the runner's own context rather than from
      # anything the repository can set, and the run URL is the point: it
      # leads to a log GitHub keeps, timestamps, and nobody with write access
      # here can edit. This file's job is to make that cross-check easy, not
      # to replace it.
      - name: Write the manifest
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p evidence-raw
          cat > evidence-raw/manifest.json <<JSON
          {
            "repository": "${{ github.repository }}",
            "ref": "${{ github.ref }}",
            "ref_type": "${{ github.ref_type }}",
            "commit": "${{ github.sha }}",
            "workflow": "${{ github.workflow }}",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${RUN_ATTEMPT}",
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "triggered_by": "${{ github.event_name }}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "runner": "$(uname -srm)",
            "note": "Cross-check this pack against run_url. That log is timestamped, retained by GitHub, and cannot be edited by anyone with write access to the repository - which this archive can."
          }
          JSON
          cat evidence-raw/manifest.json

      - name: Pack it
        run: |
          set -euo pipefail
          if [ -z "$(find evidence-raw -type f -print -quit)" ]; then
            echo "::error::no evidence was collected — refusing to attach an empty pack."
            exit 1
          fi
          echo "Evidence pack contents:"
          find evidence-raw -type f | sort

          # Checksums BEFORE zipping, so the list covers the files as they go
          # in. It detects a pack edited after the fact; it does not prove who
          # made it, which is what the attestation below is for.
          ( cd evidence-raw && find . -type f ! -name SHA256SUMS -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS )
          echo "Checksums written for $(grep -c '' evidence-raw/SHA256SUMS) file(s)."

          ( cd evidence-raw && zip -qr ../evidence.zip . )

      # A last look before anything is published — with the sense reversed.
      # This step used to REFUSE a pack containing a detailed DAST report; the
      # full report is now published on purpose (see checks.yml for the trade
      # that was made and why). So what is checked is the opposite: that the
      # report is actually there. A pack that quietly lost it would look
      # complete while proving less than the one before it.
      - name: Check the scan report is in the pack
        run: |
          set -euo pipefail
          if [ -z "$(find evidence-raw -name 'dast-passive.html' -print -quit)" ]; then
            echo "::error::the evidence pack has no dast-passive.html."
            echo "The full scan report is published deliberately — see checks.yml."
            exit 1
          fi
          echo "Checked: the full DAST report is in the pack."

      # The one thing in this pipeline that a reader does not have to take on
      # trust. Everything else here — the reports, the manifest, the checksums
      # — is produced by the repository and could be produced differently by
      # anyone able to change this workflow. An attestation is signed by
      # GitHub's own OIDC identity through Sigstore, recording which workflow,
      # at which commit, in which repository, produced this exact file.
      #
      # Verified with:
      #   gh attestation verify evidence.zip --repo ${{ github.repository }}
      #
      # That command fails if the archive was altered by so much as a byte, or
      # if it was built anywhere other than this workflow in this repository.
      - name: Attest where this pack came from
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: evidence.zip

      - name: Create the draft Release
        uses: softprops/action-gh-release@v3
        with:
          # DRAFT. The evidence is read before it becomes public, which is the
          # entire reason the gates run before this step rather than after.
          draft: true
          # A dispatch run has no tag, so it names one from the commit rather
          # than pretending to be a version.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('evidence-{0}', github.sha) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Evidence for {0}', github.sha) }}
          generate_release_notes: ${{ github.ref_type == 'tag' }}
          body: |
            Evidence produced by `.github/workflows/release.yml` for
            `${{ github.sha }}`.

            Every gate in `.github/workflows/checks.yml` passed before this
            draft was created: PHPUnit on PHP 8.1 and 8.4, PHPStan, `tsc`,
            Vitest, the Playwright end-to-end suite, and the passive OWASP ZAP
            scan. CodeQL and SonarCloud's complete analysis — quality gate,
            every measure, every open issue and every security hotspot — are
            attached alongside.

            `evidence.zip` contains only what each tool emits natively, plus a
            `manifest.json` naming the commit and the workflow run that
            produced it, and a `SHA256SUMS` covering every file in it.

            The archive is signed. To check that it came from this workflow
            in this repository and has not been altered since:

            ```
            gh attestation verify evidence.zip --repo ${{ github.repository }}
            ```

            The dynamic scan is included **in full** (`dast-passive.html`, with
            `dast-severity-summary.json` beside it). It describes a throwaway
            instance built for the scan on `127.0.0.1`, not a production host.
          files: evidence.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
